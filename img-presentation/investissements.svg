<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Georgia, serif">
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#9a5b2e"/><stop offset="100%" stop-color="#b8893a"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1f3a7a"/><stop offset="100%" stop-color="#3a5ba8"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7a4521"/><stop offset="100%" stop-color="#9a5b2e"/></linearGradient>
  </defs>

  <text x="30" y="42" font-size="26" font-weight="bold" fill="#241d12">Les investissements annoncés</text>
  <text x="30" y="68" font-size="15" font-style="italic" fill="#5c5240">en milliards d'euros — data centers &amp; IA, France / Hauts-de-France</text>

  <!-- grille -->
  <g stroke="#d8cbac" stroke-width="1">
    <line x1="200" y1="100" x2="200" y2="360"/><line x1="320" y1="100" x2="320" y2="360" stroke-dasharray="3 5"/>
    <line x1="440" y1="100" x2="440" y2="360" stroke-dasharray="3 5"/><line x1="560" y1="100" x2="560" y2="360" stroke-dasharray="3 5"/>
    <line x1="680" y1="100" x2="680" y2="360" stroke-dasharray="3 5"/>
  </g>
  <g font-size="13" fill="#5c5240" text-anchor="middle">
    <text x="320" y="382">10</text><text x="440" y="382">20</text><text x="560" y="382">30</text><text x="680" y="382">40 Mds €</text>
  </g>

  <!-- SoftBank 45 -->
  <rect x="200" y="115" width="540" height="52" rx="6" fill="url(#b1)"/>
  <text x="190" y="138" font-size="17" font-weight="bold" text-anchor="end" fill="#241d12">SoftBank</text>
  <text x="190" y="158" font-size="12.5" text-anchor="end" fill="#5c5240">3 data centers · 2031</text>
  <text x="726" y="148" font-size="22" font-weight="bold" text-anchor="end" fill="#f5eedd">45</text>

  <!-- Brookfield 20 -->
  <rect x="200" y="195" width="240" height="52" rx="6" fill="url(#b2)"/>
  <text x="190" y="218" font-size="17" font-weight="bold" text-anchor="end" fill="#241d12">Brookfield</text>
  <text x="190" y="238" font-size="12.5" text-anchor="end" fill="#5c5240">France · 2030</text>
  <text x="430" y="228" font-size="22" font-weight="bold" text-anchor="end" fill="#f5eedd">20</text>
  <text x="452" y="214" font-size="12.5" fill="#5c5240">dont 15 Mds data centers IA</text>
  <text x="452" y="232" font-size="12.5" fill="#5c5240">+ 5 Mds infrastructures énergie</text>

  <!-- Cambrai 10 -->
  <rect x="200" y="275" width="120" height="52" rx="6" fill="url(#b3)"/>
  <text x="190" y="298" font-size="17" font-weight="bold" text-anchor="end" fill="#241d12">Cambrai</text>
  <text x="190" y="318" font-size="12.5" text-anchor="end" fill="#5c5240">confirmé · Choose France</text>
  <text x="310" y="308" font-size="22" font-weight="bold" text-anchor="end" fill="#f5eedd">10</text>
  <text x="332" y="296" font-size="12.5" fill="#5c5240">méga data center 1 GW (Data4)</text>
  <text x="332" y="314" font-size="12.5" fill="#5c5240">≈ la puissance d'un réacteur nucléaire</text>

  <line x1="200" y1="100" x2="200" y2="360" stroke="#241d12" stroke-width="2"/>
  <line x1="200" y1="360" x2="740" y2="360" stroke="#241d12" stroke-width="2"/>

  <text x="30" y="430" font-size="13" font-style="italic" fill="#5c5240">Sources : DCmag, Usine Digitale, Usine Nouvelle, Le Journal des Entreprises, La Gazette France (2026)</text>
</svg>
