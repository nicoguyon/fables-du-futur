<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241b4e"/><stop offset="45%" stop-color="#6d2f86"/>
      <stop offset="75%" stop-color="#c84f7a"/><stop offset="100%" stop-color="#f2935c"/>
    </linearGradient>
    <radialGradient id="sol" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3da"/><stop offset="60%" stop-color="#ffce7a"/><stop offset="100%" stop-color="#ff9a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="terre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241646"/><stop offset="100%" stop-color="#120c28"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#ciel)"/>
  <g fill="#fff"><circle cx="100" cy="60" r="1.6"/><circle cx="260" cy="40" r="1.2"/><circle cx="420" cy="80" r="1.5"/>
  <circle cx="700" cy="50" r="1.3"/><circle cx="900" cy="90" r="1.6"/><circle cx="1080" cy="55" r="1.2"/></g>

  <!-- soleil -->
  <circle cx="600" cy="330" r="200" fill="url(#sol)" opacity=".8"/>
  <circle cx="600" cy="330" r="80" fill="#fff3da"/>

  <!-- terrils (gauche = passé minier) -->
  <path d="M-20,420 L120,250 L260,420 Z" fill="url(#terre)"/>
  <path d="M150,420 L300,210 L450,420 Z" fill="url(#terre)" opacity=".92"/>
  <!-- chevalement de mine -->
  <g stroke="#120c28" stroke-width="7" fill="none">
    <path d="M180,420 L210,300 L240,420"/><path d="M186,390 L234,390"/><path d="M193,355 L227,355"/>
    <circle cx="210" cy="293" r="12" fill="#120c28"/>
  </g>

  <!-- data centers (droite = futur IA) -->
  <g>
    <rect x="760" y="300" width="150" height="120" rx="6" fill="#120c28"/>
    <rect x="930" y="270" width="180" height="150" rx="6" fill="#1a1238"/>
    <g fill="#ffce7a">
      <rect x="775" y="316" width="120" height="5" rx="2.5" opacity=".9"/><rect x="775" y="336" width="120" height="5" rx="2.5" opacity=".7"/>
      <rect x="775" y="356" width="120" height="5" rx="2.5" opacity=".85"/><rect x="775" y="376" width="120" height="5" rx="2.5" opacity=".6"/>
      <rect x="945" y="288" width="150" height="5" rx="2.5" opacity=".9"/><rect x="945" y="310" width="150" height="5" rx="2.5" opacity=".65"/>
      <rect x="945" y="332" width="150" height="5" rx="2.5" opacity=".85"/><rect x="945" y="354" width="150" height="5" rx="2.5" opacity=".7"/>
      <rect x="945" y="376" width="150" height="5" rx="2.5" opacity=".9"/>
    </g>
    <!-- éolienne -->
    <g stroke="#120c28" stroke-width="5" fill="none">
      <line x1="1140" y1="420" x2="1140" y2="310"/>
      <g stroke-width="4"><line x1="1140" y1="310" x2="1140" y2="255"/><line x1="1140" y1="310" x2="1188" y2="338"/><line x1="1140" y1="310" x2="1092" y2="338"/></g>
      <circle cx="1140" cy="310" r="6" fill="#120c28"/>
    </g>
  </g>

  <!-- flux entre passé et futur -->
  <path d="M330,300 C480,180 720,180 860,290" fill="none" stroke="#ffce7a" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity=".9"/>
  <polygon points="860,290 838,272 846,296" fill="#ffce7a" opacity=".9"/>

  <!-- sol -->
  <rect y="416" width="1200" height="64" fill="#120c28"/>
  <text x="225" y="455" font-family="Georgia, serif" font-size="19" font-style="italic" fill="#f2d9a0" text-anchor="middle">les mines</text>
  <text x="935" y="455" font-family="Georgia, serif" font-size="19" font-style="italic" fill="#f2d9a0" text-anchor="middle">l'intelligence artificielle</text>
  <text x="600" y="455" font-family="Georgia, serif" font-size="16" fill="#b8893a" text-anchor="middle">« On passera des mines à l'IA »</text>
</svg>
