name: Nouvelle fable horaire

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: fable
  cancel-in-progress: false

jobs:
  fable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Générer la fable + illustration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/new_fable.py

      - name: Commit & push
        run: |
          git config user.name "Fable"
          git config user.email "fable@comptoiria.com"
          git add data/fables.json img/
          git commit -m "Nouvelle fable $(date -u +'%Y-%m-%d %H:00 UTC')" || exit 0
          git pull --rebase origin main
          git push
